[/Script/Engine.GameUserSettings]
FullscreenMode=2
Version=5
; Cap the render loop at 60 FPS. Without this the simulator renders as fast as
; the GPU allows, which on the small Duckietown maps means an idle server with no
; client attached can run at hundreds or thousands of frames per second: wasted
; power and heat, and enough rapid load switching to make some GPUs audibly whine.
;
; This reaches the t.MaxFPS console variable through
; UGameUserSettings::SetFrameRateLimitCVar -> GEngine->SetMaxFPS(). Note that the
; -benchmark and -fps= command line flags do NOT work here: their parsing sits
; inside a !UE_BUILD_SHIPPING guard in LaunchEngineLoop.cpp, so they are compiled
; out of packaged Shipping builds, and even in a Development build they only set a
; fixed simulation timestep rather than capping the render rate.
;
; This is only the *default*. Once a user has a saved
; Saved/Config/LinuxNoEditor/GameUserSettings.ini, that file wins -- change the
; value there instead. Set to 0.0 to go back to uncapped.
FrameRateLimit=60.000000
