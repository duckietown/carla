; Cook the whole Duckietown tree (548 MB). The maps below pull in what they
; reference, but the Duckiebot vehicle, the rubber duckie prop and the HDRI
; cubemaps are all spawned or loaded at runtime through the actor registry and
; AHDRIController rather than being placed in a level, so the cooker cannot see
; them and they would be silently missing from the package.
+DirectoriesToAlwaysCook=(Path="Duckietown")
